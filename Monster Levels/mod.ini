[Mod]
Name=Monster Levels
Version=1.3
Author=Zurnny
Group=
Description=Shows a small "Lv 4" line above each monster's name. Names several monsters share show their range (Lv 50-51); monsters missing from the list keep their plain nameplate. Monster levels come from the RoseUtils drop list, as shipped with RoseLite (github.com/DrezByte/RoseLite). Switch: Options > UI > Add-ons.\nAdd-on for the game's default UI and the Steampunk UI theme. Works on its own or together with any of the other add-ons: they share their Options page, each adding its own line. Each window checks which of the two is installed and uses its look.
Changes=The level text is bold again (safe now that it sits in its own text box).
Priority=5
UpdateUrl=https://raw.githubusercontent.com/Zurnny/ROSE-Monster-Levels/main/Monster%20Levels/manifest.txt
