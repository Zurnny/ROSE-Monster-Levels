<rml>
    <head>
        <title>Monster names</title>
        <link type="text/rcss" href="../styles/html.css" />
        <link type="text/rcss" href="../styles/spritesheet_world_ui.css" />
        <link type="text/rcss" href="../styles/spritesheet_targetmark.css" />
        <link type="text/rcss" href="../styles/spritesheet_elementicon.css" />
        <link type="text/rcss" href="../styles/spritesheet_gauge.css" />
        <link type="text/rcss" href="../styles/gauge.css" />
        <link type="text/rcss" href="../styles/components.css" />
        <style>
            .monster-nameplate { margin-top: -24dp; }
            .monster-nameplate.detailed { margin-top: -44dp; }
            .monster-marker:not(.generic) { position: absolute; height: 18dp; top: 50%; margin-top: -9dp; }
            .monster-debug { position: absolute; bottom: 100%; width: 100%; font-size: 10dp; color: yellow; }
            /* Monster Levels add-on: the level line above the name (absolute, so the name stays where the game puts it).
               It is a read-only text box: it draws its own text, so filling it in never creates new
               text elements (which made the game log "No font face defined"). */
            .monster-nameplate .sp-mob-lv { position: absolute; bottom: 100%; left: 0; width: 100%; height: 1.1em; padding: 0; margin: 0; decorator: none; background: transparent; border: 0; font-family: Nunito; font-weight: 800; font-size: 0.75em; line-height: 1.1em; color: rgb(255, 224, 102); text-align: center; font-effect: outline(1dp black); pointer-events: none; tab-index: none; }
            #monster-nameplates.sp-mlv-off .sp-mob-lv { display: none; }
            @keyframes sp-mlv-tick-a { from { opacity: 0; } to { opacity: 0; } }
            @keyframes sp-mlv-tick-b { from { opacity: 0; } to { opacity: 0; } }
            #sp-mlv-timer { position: absolute; width: 1dp; height: 1dp; opacity: 0; pointer-events: none; animation: 0.5s sp-mlv-tick-a; }
            @keyframes sp-switch-tick-a { from { opacity: 0; } to { opacity: 0; } }
            @keyframes sp-switch-tick-b { from { opacity: 0; } to { opacity: 0; } }
            #sp-switch-timer { position: absolute; width: 1dp; height: 1dp; opacity: 0; pointer-events: none; animation: 2s sp-switch-tick-a; }
        </style>
        <script>
-- Monster Levels (add-on): a small "Lv 4" line above each monster's name.
-- The nameplates only carry the name, so the level comes from the list in
-- Data/ui/sp_mob_levels.txt (monster levels from the RoseUtils drop list, as
-- shipped with RoseLite), read once when this window loads. A name that several
-- monsters share shows its range (Lv 50-51).
-- Monsters that aren't in the list keep their plain nameplate. Twice a second
-- the script fills in any nameplate that has appeared since.
pcall(function()
    local document = document
    local LEVELS = {}
    pcall(function()
        local f = io.open('Data/ui/sp_mob_levels.txt', 'r')
        if not f then return end
        for line in f:lines() do
            local n, v = line:match('^(.-)=(Lv .-)%s*$')
            if n and n ~= '' then LEVELS[n] = v end
        end
        f:close()
    end)
    local function each(list, fn)
        if not list then return end
        local i = list[0] and 0 or 1
        while list[i] do fn(list[i]); i = i + 1 end
    end
    local function fill()
        each(document:QuerySelectorAll('.sp-mob-lv'), function(e)
            local name = e:GetAttribute('sp-name') or ''
            local want = LEVELS[name] or LEVELS[(name:gsub('%s*%b()%s*$', ''))] or ''
            if e:GetAttribute('sp-shown') ~= want then
                e:SetAttribute('value', want)
                e:SetAttribute('sp-shown', want)
            end
        end)
    end
    pcall(fill)
    local timer = document:GetElementById('sp-mlv-timer')
    local flip = false
    if timer then
        timer:AddEventListener('animationend', function()
            pcall(fill)
            flip = not flip
            timer.style.animation = '0.5s ' .. (flip and 'sp-mlv-tick-b' or 'sp-mlv-tick-a')
        end)
    end
end)
        </script>
    <script>
-- Add-on switches (the same script in every add-on window).
-- SP_ADDON_SWITCH mob_levels
-- An add-on counts as installed while its marker file
-- Data/ui/sp_addons/<key>.txt exists. The launcher copies the marker in with
-- the add-on and takes it out again with it, so a window that several add-ons
-- share only runs the parts of the add-ons that are installed.
-- The on/off switches are in Options > UI > Add-ons and are saved in
-- sp_addons.txt (the Ice UI uses the same file; nobody removes anyone else's
-- lines). This window reads it every 2 seconds. Everything is on by default.
pcall(function()
    local BODY = 'monster-nameplates'
    -- key, class put on this window while that add-on is off or not installed ('' = none)
    local MINE = {{'mob_levels', 'sp-mlv-off'}}
    local installed = {}
    SP_ADDON_INSTALLED = function(key)
        -- the Steampunk UI theme has every add-on built in
        if SP_THEME == 'steampunk' then return true end
        if installed[key] == nil then
            installed[key] = true      -- if the game won't let the UI read files, assume installed
            pcall(function()
                local f = io.open('Data/ui/sp_addons/' .. key .. '.txt', 'r')
                if f then f:close() else installed[key] = false end
            end)
        end
        return installed[key]
    end
    local flags = {}
    local function read_flags()
        flags = {}
        pcall(function()
            local f = io.open('sp_addons.txt', 'r')
            if not f then return end
            for line in f:lines() do
                local k, v = line:match('^%s*([%w_]+)%s*=%s*(%d)')
                if k then flags[k] = v end
            end
            f:close()
        end)
    end
    -- SP_ADDON_ON(key): installed and not switched off. Reads the switches fresh
    -- unless called with fresh == false.
    SP_ADDON_ON = function(key, fresh)
        if not SP_ADDON_INSTALLED(key) then return false end
        if fresh ~= false then read_flags() end
        return flags[key] ~= '0'
    end
    local doc = document
    local function apply()
        read_flags()
        for _, m in ipairs(MINE) do
            local on = SP_ADDON_ON(m[1], false)
            if m[2] ~= '' then pcall(function() (doc:GetElementById(BODY) or doc):SetClass(m[2], not on) end) end
            -- a script in this window can register SP_ADDON_HOOK['<key>@<body id>'] = function(on) ... end
            local hook = SP_ADDON_HOOK and SP_ADDON_HOOK[m[1] .. '@' .. BODY]
            if hook then pcall(hook, on) end
        end
    end
    apply()
    doc:AddEventListener('show', function() pcall(apply) end)
    doc:AddEventListener('mouseover', function() pcall(apply) end)
    -- repeating 2 second check: two identical animations swapped each time one ends
    pcall(function()
        local timer = doc:GetElementById('sp-switch-timer')   -- the empty div at the end of the body
        local flip = false
        timer:AddEventListener('animationend', function()
            pcall(apply)
            flip = not flip
            timer.style.animation = '2s ' .. (flip and 'sp-switch-tick-b' or 'sp-switch-tick-a')
        end)
    end)
end)
    </script>
    </head>
    <body id="monster-nameplates">
        <!-- The model binds on a child: a body-level model attaches after parsing, too late for data-for templates. -->
        <div id="monster-nameplates-root" data-model="monster-nameplates" data-style-font-size="font_size + 'dp'">
        <div class="monster-nameplate" data-for="plate : nameplates" data-if="plate.visible" data-class-detailed="plate.detailed"
             data-style-left="plate.x + 'px'" data-style-top="plate.y + 'px'" data-style-transform="plate.transform" data-style-color="plate.color">
            <input class="sp-mob-lv" type="text" readonly="" value="" data-attr-sp-name="plate.name" />
            <div class="monster-name-line"><span class="monster-name">{{plate.name}}</span><img class="monster-marker left" data-if="plate.show_left" data-class-generic="plate.generic" data-attr-sprite="plate.left_sprite"/><img class="monster-marker right" data-if="plate.show_right" data-class-generic="plate.generic" data-class-mirrored="plate.mirrored" data-attr-sprite="plate.right_sprite"/></div>
            <gauge class="monster-health horizontal-sm-md red" animation-enabled="false" data-if="plate.show_health" data-attr-gmax="plate.max_hp" data-attr-gvalue="plate.hp"/>
            <div class="monster-debug" data-if="plate.show_debug">{{plate.debug_info}}</div>
        </div>
        </div>
        <div id="sp-mlv-timer"></div>
        <div id="sp-switch-timer"></div>
    </body>
</rml>
